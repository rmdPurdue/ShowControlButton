; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_m4]
platform = atmelsam
board = adafruit_feather_m4
framework = arduino

; 🚀 Force the monitor to a standard fast baud rate
monitor_speed = 115200

; 🔄️ Automatically try to find and open the serial monitor after uploading
monitor_filters = default, time

; 🛠️ Unleash strict C++ warnings to catch bugs before flashing
build_flags = 
	-Wall
	-Wextra

; 📚 Library dependencies